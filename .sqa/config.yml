config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cyfronet-fid/eosc-search-service:
      branch: 1628-getting-golden-SQA-badge-v3
      repo: https://github.com/cyfronet-fid/eosc-search-service.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-auburn-akbash.sh
        container: qc.acc_ready-violet-seal
  QC.Doc:
    repos:
      github.com/cyfronet-fid/eosc-search-service find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.skanky-pear-crocodile.sh
        container: qc.doc_sickly-taupe-manatee
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-turquoise-indri.sh
        container: qc.doc_pasty-charcoal-liger
      github.com/cyfronet-fid/eosc-search-service markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.gamy-ultramarine-buffalo.sh
        container: qc.doc_boozy-chestnut-hornet
  QC.Lic:
    repos:
      github.com/cyfronet-fid/eosc-search-service licensee:
        commands:
        - /usr/bin/env sh .sqa/script.hasty-purple-baboon.sh
        container: qc.lic_slaphappy-silver-coral
  QC.Met:
    repos:
      github.com/cyfronet-fid/eosc-search-service cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-flax-badger.sh
        container: qc.met_squirrely-grey-dragon
  QC.Sec:
    repos:
      github.com/cyfronet-fid/eosc-search-service bandit:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-mauve-neanderthal.sh
        container: qc.sec_cloudy-champagne-booby
  QC.Sty:
    repos:
      github.com/cyfronet-fid/eosc-search-service flake8:
        commands:
        - /usr/bin/env sh .sqa/script.snazzy-gamboge-peccary.sh
        container: qc.sty_clammy-cinnabar-cougar
      github.com/cyfronet-fid/eosc-search-service hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.baggy-cinnamon-cuttlefish.sh
        container: qc.sty_surly-jade-ladybird
      github.com/cyfronet-fid/eosc-search-service jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-cyan-chinchilla.sh
        container: qc.sty_cranky-charcoal-rhinoceros
  QC.Uni:
