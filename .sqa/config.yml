      github.com/cyfronet-fid/eosc-search-service pytest:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-seashell-ray.sh
        container: qc.uni_bluesy-sepia-fossa
  QC.Ver:
    repos:
      github.com/cyfronet-fid/eosc-search-service get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-bistre-audemer.sh
        container: qc.ver_sickly-lemon-crab
timeout: 5400
