config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cyfronet-fid/eosc-search-service:
      branch: development
      repo: https://github.com/cyfronet-fid/eosc-search-service.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.ugly-pumpkin-reindeer.sh
        container: qc.acc_tasty-cardinal-fossa
  QC.Doc:
    repos:
      github.com/cyfronet-fid/eosc-search-service find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.skinny-violet-bobcat.sh
        container: qc.doc_slaphappy-scarlet-bonobo
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.snoopy-eggplant-booby.sh
        container: qc.doc_stealthy-apricot-squirt
      github.com/cyfronet-fid/eosc-search-service markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.wheezy-beige-fousek.sh
        container: qc.doc_slimy-cinnabar-tetra
  QC.Lic:
    repos:
      github.com/cyfronet-fid/eosc-search-service licensee:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-turquoise-grouse.sh
        container: qc.lic_beady-cornflower-warthog
  QC.Sec:
    repos:
      github.com/cyfronet-fid/eosc-search-service bandit:
        commands:
        - /usr/bin/env sh .sqa/script.zippy-white-havanese.sh
        container: qc.sec_cheeky-salmon-dunker
  QC.Sty:
    repos:
      github.com/cyfronet-fid/eosc-search-service flake8:
        commands:
        - /usr/bin/env sh .sqa/script.trippy-silver-liger.sh
        container: qc.sty_zippy-sapphire-clam
      github.com/cyfronet-fid/eosc-search-service hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.surly-chestnut-stoat.sh
        container: qc.sty_pokey-turquoise-jellyfish
      github.com/cyfronet-fid/eosc-search-service jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.shaggy-burgundy-sloth.sh
        container: qc.sty_breezy-olive-discus
  QC.Uni:
    repos:
      github.com/cyfronet-fid/eosc-search-service pytest:
        commands:
        - /usr/bin/env sh .sqa/script.droopy-charcoal-shrew.sh
        container: qc.uni_scanty-rust-javanese
  QC.Ver:
    repos:
      github.com/cyfronet-fid/eosc-search-service get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cloudy-viridian-woodpecker.sh
        container: qc.ver_messy-smalt-toad
timeout: 5400
