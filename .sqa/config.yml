config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cyfronet-fid/eosc-search-service:
      branch: development
      repo: https://github.com/cyfronet-fid/eosc-search-service.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.stuffy-pumpkin-tamarin.sh
        container: qc.acc_sleazy-cream-tapir
  QC.Doc:
    repos:
      github.com/cyfronet-fid/eosc-search-service find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-scarlet-scorpion.sh
        container: qc.doc_cheeky-tangerine-slug
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.stinky-ochre-bombay.sh
        container: qc.doc_wimpy-seashell-pinscher
      github.com/cyfronet-fid/eosc-search-service markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.dorky-carmine-scorpion.sh
        container: qc.doc_cozy-amethyst-raccoon
  QC.Lic:
    repos:
      github.com/cyfronet-fid/eosc-search-service licensee:
        commands:
        - /usr/bin/env sh .sqa/script.whiny-smalt-tarantula.sh
        container: qc.lic_nippy-ecru-wombat
  QC.Sec:
    repos:
      github.com/cyfronet-fid/eosc-search-service bandit:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-grey-grasshopper.sh
        container: qc.sec_foggy-green-retriever
  QC.Sty:
    repos:
      github.com/cyfronet-fid/eosc-search-service flake8:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-khaki-koala.sh
        container: qc.sty_freaky-chestnut-armadillo
      github.com/cyfronet-fid/eosc-search-service hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.muzzy-pumpkin-turtle.sh
        container: qc.sty_thirsty-khaki-eleuth
      github.com/cyfronet-fid/eosc-search-service jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-emerald-labradoodle.sh
        container: qc.sty_droopy-crimson-oriole
  QC.Uni:
    repos:
      github.com/cyfronet-fid/eosc-search-service pytest:
        commands:
        - /usr/bin/env sh .sqa/script.blurry-maroon-barracuda.sh
        container: qc.uni_pretty-olive-dalmatian
  QC.Ver:
    repos:
      github.com/cyfronet-fid/eosc-search-service get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.craggy-celadon-termite.sh
        container: qc.ver_homey-copper-crane
timeout: 5400
