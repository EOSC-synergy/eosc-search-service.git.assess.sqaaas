config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cyfronet-fid/eosc-search-service:
      branch: development
      repo: https://github.com/cyfronet-fid/eosc-search-service.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.shaky-harlequin-boar.sh
        container: qc.acc_lanky-yellow-schnauzer
  QC.Doc:
    repos:
      github.com/cyfronet-fid/eosc-search-service find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.frumpy-bistre-leopard.sh
        container: qc.doc_flimsy-cornflower-dogfish
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-olive-zonkey.sh
        container: qc.doc_lovely-alizarin-lion
      github.com/cyfronet-fid/eosc-search-service markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.hilly-puce-rhinoceros.sh
        container: qc.doc_gloppy-azure-whippet
  QC.Lic:
    repos:
      github.com/cyfronet-fid/eosc-search-service licensee:
        commands:
        - /usr/bin/env sh .sqa/script.scanty-maroon-impala.sh
        container: qc.lic_squeaky-linen-weasel
  QC.Sec:
    repos:
      github.com/cyfronet-fid/eosc-search-service bandit:
        commands:
        - /usr/bin/env sh .sqa/script.smelly-khaki-ladybird.sh
        container: qc.sec_droopy-ochre-molly
  QC.Sty:
    repos:
      github.com/cyfronet-fid/eosc-search-service flake8:
        commands:
        - /usr/bin/env sh .sqa/script.clammy-lemon-beaver.sh
        container: qc.sty_pokey-apricot-uguisu
      github.com/cyfronet-fid/eosc-search-service hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.freaky-wheat-frigatebird.sh
        container: qc.sty_geeky-white-macaw
      github.com/cyfronet-fid/eosc-search-service jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.gimpy-peach-worm.sh
        container: qc.sty_grumpy-ecru-magpie
  QC.Uni:
    repos:
      github.com/cyfronet-fid/eosc-search-service pytest:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-charcoal-skunk.sh
        container: qc.uni_frumpy-celadon-reindeer
  QC.Ver:
    repos:
      github.com/cyfronet-fid/eosc-search-service get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.woozy-auburn-raccoon.sh
        container: qc.ver_cozy-thistle-wolfhound
timeout: 5400
