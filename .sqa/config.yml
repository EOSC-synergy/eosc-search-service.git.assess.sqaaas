config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: main
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/cyfronet-fid/eosc-search-service:
      branch: development
      repo: https://github.com/cyfronet-fid/eosc-search-service.git
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.wiggy-cornflower-flounder.sh
        container: qc.acc_breezy-persimmon-scorpion
  QC.Doc:
    repos:
      github.com/cyfronet-fid/eosc-search-service find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.muggy-xanthic-octopus.sh
        container: qc.doc_gamy-pink-bobcat
      github.com/cyfronet-fid/eosc-search-service git:
        commands:
        - /usr/bin/env sh .sqa/script.beady-red-harrier.sh
        container: qc.doc_pokey-pumpkin-angelfish
      github.com/cyfronet-fid/eosc-search-service markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.crabby-firebrick-snail.sh
        container: qc.doc_nerdy-cornflower-rottweiler
  QC.Lic:
    repos:
      github.com/cyfronet-fid/eosc-search-service licensee:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-olive-rhinoceros.sh
        container: qc.lic_foggy-linen-chow
  QC.Met:
    repos:
      github.com/cyfronet-fid/eosc-search-service cff-converter-python:
        commands:
        - /usr/bin/env sh .sqa/script.woolly-carmine-uakari.sh
        container: qc.met_slimy-thistle-axolotl
  QC.Sec:
    repos:
      github.com/cyfronet-fid/eosc-search-service bandit:
        commands:
        - /usr/bin/env sh .sqa/script.nippy-alizarin-cattle.sh
        container: qc.sec_sleepy-firebrick-booby
  QC.Sty:
    repos:
      github.com/cyfronet-fid/eosc-search-service flake8:
        commands:
        - /usr/bin/env sh .sqa/script.queasy-charcoal-audemer.sh
        container: qc.sty_sloppy-sapphire-hummingbird
      github.com/cyfronet-fid/eosc-search-service hadolint:
        commands:
        - /usr/bin/env sh .sqa/script.crappy-vermilion-chipmunk.sh
        container: qc.sty_beady-bistre-markhor
      github.com/cyfronet-fid/eosc-search-service jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.paltry-pink-hound.sh
        container: qc.sty_flimsy-smalt-bonobo
