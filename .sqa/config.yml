      github.com/cyfronet-fid/eosc-search-service pytest:
        commands:
        - /usr/bin/env sh .sqa/script.tacky-lime-crane.sh
        container: qc.uni_fuzzy-maroon-lionfish
  QC.Ver:
    repos:
      github.com/cyfronet-fid/eosc-search-service get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.nerdy-sepia-centipede.sh
        container: qc.ver_homely-pink-indri
timeout: 5400
